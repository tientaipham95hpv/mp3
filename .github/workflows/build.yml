name: Build Unsigned IPA & Vercel Backend

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-test:
    name: 🐍 Test Python & Vercel Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Vercel & FastAPI Entrypoint
        run: |
          python -c "import api.index; print('Vercel entrypoint api/index.py verified!')"

  ios-build-ipa:
    name: 📱 Build Unsigned .IPA File (macOS)
    runs-on: macos-latest
    needs: backend-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Build Executable with Swift PM
        run: |
          cd ios-app/YTMusicPlayer
          swift build -c release

      - name: Create Unsigned .IPA Package
        run: |
          mkdir -p Payload/YTMusicPlayer.app
          cp -r ios-app/YTMusicPlayer/.build/release/YTMusicPlayer Payload/YTMusicPlayer.app/
          cp ios-app/YTMusicPlayer/Info.plist Payload/YTMusicPlayer.app/
          zip -r YTMusicPlayer-unsigned.ipa Payload
          echo "IPA generation complete!"

      - name: Upload Unsigned .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicPlayer-unsigned-ipa
          path: YTMusicPlayer-unsigned.ipa
