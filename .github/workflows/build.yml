name: Build Unsigned IPA & Vercel Backend

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-test:
    name: 🐍 Test Python & Vercel Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Vercel & FastAPI Entrypoint
        run: |
          python -c "import api.index; print('Vercel entrypoint api/index.py verified!')"

  ios-build-ipa:
    name: 📱 Build Valid iOS ARM64 .IPA File (macOS)
    runs-on: macos-latest
    needs: backend-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Create App Payload Directory
        run: |
          mkdir -p Payload/YTMusicPlayer.app

      - name: Compile Native iOS ARM64 Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios15.0 \
            -parse-as-library \
            -O \
            ios-app/YTMusicPlayer/App/*.swift \
            ios-app/YTMusicPlayer/Models/*.swift \
            ios-app/YTMusicPlayer/Services/*.swift \
            ios-app/YTMusicPlayer/Views/*.swift \
            ios-app/YTMusicPlayer/Views/Components/*.swift \
            -o Payload/YTMusicPlayer.app/YTMusicPlayer

      - name: Package Valid IPA Bundle
        run: |
          cp ios-app/YTMusicPlayer/Info.plist Payload/YTMusicPlayer.app/Info.plist
          zip -r YTMusicPlayer-unsigned.ipa Payload
          echo "Valid iOS ARM64 IPA packaging complete!"

      - name: Upload Unsigned .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicPlayer-unsigned-ipa
          path: YTMusicPlayer-unsigned.ipa
