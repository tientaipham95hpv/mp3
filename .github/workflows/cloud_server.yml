name: 24/7 Online Cloud Backend Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Backend and Cloudflare Tunnel Online 24/7
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
        run: |
          python backend/main.py &
          sleep 3
          if [ -n "$TUNNEL_TOKEN" ]; then
            echo "Starting Permanent Cloudflare Named Tunnel with static token..."
            cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN"
          else
            echo "Starting Quick Cloudflare Tunnel..."
            cloudflared tunnel --url http://localhost:8000
          fi
